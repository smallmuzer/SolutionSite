<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="406" viewBox="0 0 1024 406">
  <defs>
    <linearGradient id="orangeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc52b"/>
      <stop offset="0.43" stop-color="#f58212"/>
      <stop offset="1" stop-color="#d93f0b"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#73d9ff"/>
      <stop offset="0.52" stop-color="#2f9fd0"/>
      <stop offset="1" stop-color="#1b5fa5"/>
    </linearGradient>
    <linearGradient id="grayGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#777"/>
      <stop offset="1" stop-color="#454545"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000" flood-opacity="0.25"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.45"/>
    </filter>
  </defs>

  <!-- Orange crescent symbol -->
  <path filter="url(#shadow)" fill="url(#orangeGrad)" d="
    M262 58
    C202 30 128 37 76 85
    C20 137 4 218 35 288
    C67 361 143 407 221 402
    C256 400 286 389 297 369
    C310 345 292 318 260 311
    C192 296 143 265 121 217
    C96 162 116 105 165 74
    C194 55 226 49 262 58 Z"/>

  <!-- Blue inner flame -->
  <path filter="url(#shadow)" fill="url(#blueGrad)" d="
    M207 82
    C236 71 268 82 286 111
    C304 140 315 175 325 211
    C337 254 334 302 322 340
    C326 282 311 234 286 199
    C267 172 237 177 215 164
    C191 149 191 103 207 82 Z"/>
  <path fill="#ffffff" opacity="0.28" d="M211 84 C240 78 265 90 282 116 C253 95 225 89 205 99 C206 93 207 88 211 84 Z" filter="url(#soft)"/>

  <!-- Company text -->
  <text x="360" y="190" font-family="Arial, Helvetica, sans-serif" font-size="145" font-style="italic" font-weight="400" fill="#e86613">Systems</text>
  <text x="354" y="355" font-family="Arial, Helvetica, sans-serif" font-size="143" font-style="italic" font-weight="400" fill="url(#grayGrad)">Solutions</text>
  <text x="979" y="107" font-family="Arial, Helvetica, sans-serif" font-size="34" fill="#444">™</text>
